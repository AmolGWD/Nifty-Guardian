# Production nginx config for the React Operations Dashboard's static
# build. `frontend/nginx.conf` (unchanged) remains the minimal
# dev-parity config used by the root-level docker-compose.yml; this
# one adds gzip, cache headers, and basic security headers for an
# actual production deployment.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # index.html must always be revalidated (it references hashed
    # asset filenames) - everything else is content-hashed by Vite and
    # can be cached aggressively.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
