name: Full Platform CI

# Runs on every push/PR regardless of which files changed - the
# single gate that answers "does the whole platform still build and
# pass together," on top of backend.yml/frontend.yml's faster,
# path-filtered checks. Docker build verification here only builds
# each image locally to confirm the Dockerfile is correct - it never
# pushes an image anywhere.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    uses: ./.github/workflows/backend.yml

  frontend:
    uses: ./.github/workflows/frontend.yml

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose configs
        run: |
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml config
          VITE_API_BASE_URL=https://ci-placeholder.example.com \
            docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml config

      - name: Build backend image (production target)
        run: docker build -f deploy/docker/backend.Dockerfile --target production -t nifty-guardian-backend:ci .

      - name: Build frontend image (production target)
        run: docker build -f deploy/docker/frontend.Dockerfile --target production -t nifty-guardian-frontend:ci .
