name: Backend CI

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Test-only value, not a real secret - CI has no .env file and
      # Settings.secret_key has no default (by design, see config.py).
      SECRET_KEY: "3z3sD1v3zK7f3F1v3F7f3F1v3F7f3F1v3F7f3F1v3F0="
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app tests

      - name: Test (pytest)
        run: pytest tests/ -v
